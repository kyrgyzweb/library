<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library Project</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<!-- Curved Burgundy Bookshelf Top Banner -->
    <div class="hero-banner">
        <div class="banner-top">
            <span class="pill-badge">Library Catalog</span>
            <div class="user-profile">
                <div class="user-info">
                    <strong>Abdullah</strong>
                    <span>ID. 204637489</span>
                </div>
                <div class="avatar">A</div>
            </div>
        </div>
    <!-- Smooth S-Curve SVG Divider -->
        <svg class="wave-divider" viewBox="0 0 1440 160" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,120 C380,-40 880,190 1440,80 L1440,160 L0,160 Z"></path>
        </svg>
    </div>

    <!-- Sticky Serif Heading & Pill-Style Horizontal Form -->
    <main>
        <header>
            <h1>LIBRARY BOOKS</h1>
        </header>

        <form action="#" id="book-form">
            <label for="title">Book title:</label>
            <input type="text" name="title" id="title" placeholder="e.g Prophet Muhammad" required>

            <label for="author">Author:</label>
            <input type="text" name="author" id="author" placeholder="Fethullah Gülen" required>

            <label for="pages">Pages:</label>
            <input type="number" name="pages" id="pages" placeholder="270" min="1" required>

            <label for="isRead">Status:</label>
            <input type="checkbox" name="isRead" id="isRead">

            <button type="submit">Add Book</button>
        </form>
    </main>

    <!-- Flexbox Book Cover Shelf -->
    <section class="library-container"></section>

</body>
</html>
